<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Watchlist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>My Watchlist</h1>
    <p class="subtitle">Films and series I want to watch</p>
  </header>

  <main>
    <div class="movie-grid">

      <article class="movie-card">
        <img src="https://image.tmdb.org/t/p/w300/d5NXSklXo0qyIYkgV94XAgMIckC.jpg"
             alt="Poster for Dune: a figure standing on a desert ridge">
        <h2>Dune</h2>
        <p class="year">2021</p>
        <span class="badge">Watched</span>
      </article>

      <article class="movie-card">
        <img src="https://image.tmdb.org/t/p/w300/rrBuGu0Pjq7Y2BWSI6teGfZzviY.jpg"
             alt="Poster for Heat: three men above a blue night-time cityscape">
        <h2>Heat</h2>
        <p class="year">1995</p>
        <span class="badge">Not watched</span>
      </article>

      <article class="movie-card">
        <img src="https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
             alt="Poster for Avengers: Endgame: a group of superheroes fighting one last time">
        <h2>Avengers: Endgame</h2>
        <p class="year">2019</p>
        <span class="badge">Watched</span>
      </article>
      trying
      <!-- Task 1.3: add four more cards here. Copy the pattern above. -->

    </div>
  </main>

  <footer>
    <p>Built by &lt;your-name&gt; while learning to code.</p>
  </footer>
</body>
</html>
