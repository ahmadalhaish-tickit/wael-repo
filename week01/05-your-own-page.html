<!-- PRACTISING: everything from exercises 1 to 4, with nothing to copy.

     WHAT TO DO:
     Build a one-page profile of yourself. Your name, a photo or an image you like,
     a short paragraph about why you are learning to code, a list of three things
     you want to build, and a link to your GitHub profile.

     Requirements:
     1. Use at least three different heading levels.
     2. Use at least one list.
     3. Use at least one image with real alt text.
     4. Use at least one link.
     5. Style it with a <style> block in the head: your own colours, your own
        spacing. It does not have to be beautiful. It has to be yours.

     THERE IS NO RIGHT ANSWER TO THIS ONE. That is deliberate, and it is the point
     of the exercise. Exercises 1 to 4 had a correct result you could check against.
     This one is the first thing you build with nobody telling you what it should
     look like, which is what the job actually is.

     If you are stuck staring at an empty file: start with the h1. Just your name.
     Then add one thing at a time. Nobody writes a page top to bottom in one go.
-->
