<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Exercise 2 — images and links</title>
</head>
<body>

<!-- PRACTISING: the img and a tags, and their attributes.

     WHAT TO DO:
     1. Open this in your browser. Both images load, and the link works.
     2. Add three more film posters below the example, each one wrapped in a link to
        that film's page on IMDb.
     3. Give every image real alt text that describes the picture.
     4. Deliberately break one image by changing its src to nonsense. Reload. Notice
        that the alt text appears in its place. Then fix it.

     ABOUT ALT TEXT: it is what a screen reader reads aloud to a blind visitor, and
     what appears when an image fails to load. It is not optional and it is not
     decoration. Describe the picture, not the file: "poster for Heat, two men at
     night" — not "poster.jpg" and not "image".

     ABOUT target="_blank": it opens the link in a new tab. Useful for links that
     lead away from your site.

     LEARN: https://developer.mozilla.org/en-US/docs/Learn/HTML/Multimedia_and_embedding/Images_in_HTML
-->

<main>

  <h1>Films I want to watch</h1>

  <a href="https://www.imdb.com/title/tt1160419/" target="_blank">
    <img src="https://image.tmdb.org/t/p/w300/d5NXSklXo0qyIYkgV94XAgMIckC.jpg"
         alt="Poster for Dune: a figure standing on a desert ridge"
         width="200">
  </a>

  <a href="https://www.imdb.com/title/tt0113277/" target="_blank">
    <img src="https://image.tmdb.org/t/p/w300/rrBuGu0Pjq7Y2BWSI6teGfZzviY.jpg"
         alt="Poster for Heat: three men above a blue night-time cityscape"
         width="200">
  </a>

  <!-- Add three more here -->

</main>

</body>
</html>
